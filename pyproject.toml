[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowdesk-mcp"
version = "0.1.0"
description = "Local workflow automation with a browser editor and MCP tools"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2", "pydantic>=2.8,<3", "starlette>=0.37,<2", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.scripts]
flowdesk = "flowdesk.__main__:main"

[tool.setuptools.package-data]
flowdesk = ["static/*"]

[tool.setuptools.packages.find]
include = ["flowdesk*"]
